{% extends "base.html" %}
{% block title %}Acceso de Prueba{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-white py-3">
        <h5 class="mb-0">Identificación para Pruebas del MVP</h5>
      </div>
      <div class="card-body">
        <form method="POST" action="{{ url_for('login') }}">
          <div class="mb-3">
            <label class="form-label fw-semibold">Nombre del usuario de prueba</label>
            <input type="text" name="usuario" class="form-control" value="{{ usuario }}" required />
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Rol en el flujo</label>
            <select name="rol" class="form-select">
              <option value="Docente / Reportante" {% if rol == "Docente / Reportante" %}selected{% endif %}>Docente / Reportante</option>
              <option value="Coordinador / Soporte" {% if rol == "Coordinador / Soporte" %}selected{% endif %}>Coordinador / Soporte</option>
              <option value="Administrador" {% if rol == "Administrador" %}selected{% endif %}>Administrador</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary w-100">Entrar al Tablero</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
