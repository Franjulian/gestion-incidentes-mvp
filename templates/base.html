<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Gestión de Incidentes Educativos (MVP){% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="{{ url_for('dashboard') }}">Incidentes Educativos · MVP</a>
      <div class="d-flex align-items-center gap-2 flex-wrap">
        <span class="badge text-bg-secondary">{{ usuario }} ({{ rol }})</span>
        <a class="btn btn-sm btn-outline-light" href="{{ url_for('dashboard') }}">Tablero</a>
        <a class="btn btn-sm btn-warning" href="{{ url_for('registrar') }}">+ Nuevo Incidente</a>
        <a class="btn btn-sm btn-outline-info" href="{{ url_for('login') }}">Cambiar Usuario</a>
      </div>
    </div>
  </nav>

  <main class="container pb-5">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
