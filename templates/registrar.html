{% extends "base.html" %}
{% block title %}Registrar Incidente{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-white py-3">
        <h5 class="mb-0">Registrar Nuevo Incidente Educativo</h5>
      </div>
      <div class="card-body">
        {% if error %}
          <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('registrar') }}">
          <div class="mb-3">
            <label class="form-label fw-semibold">Título del incidente *</label>
            <input type="text" name="titulo" class="form-control" placeholder="Ej. Proyector sin señal en aula 204" required />
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Categoría</label>
              <select name="categoria" class="form-select">
                <option value="Infraestructura / Aula">Infraestructura / Aula</option>
                <option value="Equipos / Audiovisuales">Equipos / Audiovisuales</option>
                <option value="Conectividad / Red">Conectividad / Red</option>
                <option value="Convivencia / Operación">Convivencia / Operación</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Sede o espacio</label>
              <input type="text" name="sede_o_espacio" class="form-control" placeholder="Ej. Sede Principal - Sala de Sistemas 2" />
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Prioridad</label>
              <select name="prioridad" class="form-select">
                <option value="Baja">Baja</option>
                <option value="Media" selected>Media</option>
                <option value="Alta">Alta</option>
                <option value="Crítica">Crítica</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Asignar a</label>
              <input type="text" name="asignado_a" class="form-control" value="Soporte Técnico / Medios Audiovisuales" />
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Reportado por</label>
            <input type="text" name="reportado_por" class="form-control" value="{{ usuario }}" />
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold">Descripción detallada *</label>
            <textarea name="descripcion" rows="4" class="form-control" placeholder="Describe qué ocurrió, cuándo se detectó y cómo afecta la actividad..." required></textarea>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Guardar Incidente</button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
